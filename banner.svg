<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="Pushpender Singh Rathore. A great user can run a masterpiece, but a masterpiece can build the exploit itself.">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9FEF00"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="quoteGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#9FEF00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f3d2e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a0e13" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#101720" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4553"/>
    </marker>
    <marker id="arrowteal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="460" fill="#0a0e13"/>
  <rect x="0" y="0" width="1280" height="460" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="460" fill="url(#glow)"/>

  <text x="640" y="56" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace" font-size="14" letter-spacing="4" fill="#00D4FF">OFFENSIVE SECURITY   ·   EXPLOIT DEVELOPMENT   ·   METASPLOIT</text>

  <text x="640" y="124" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="50" font-weight="700" fill="url(#nameGrad)">Pushpender Singh Rathore</text>

  <line x1="596" y1="146" x2="684" y2="146" stroke="#2a3441" stroke-width="2"/>

  <text x="640" y="214" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="29" fill="#C7D2DC">A great user can run a masterpiece,</text>
  <text x="640" y="256" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="29" fill="url(#quoteGrad)">but a masterpiece can build the exploit itself.</text>

  <!-- the loop -->
  <g font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace" font-size="15" fill="#9FEF00" text-anchor="middle">
    <rect x="286" y="344" width="150" height="44" rx="22" fill="#10151c" stroke="#2a3441"/>
    <text x="361" y="372">RECON</text>
    <rect x="472" y="344" width="150" height="44" rx="22" fill="#10151c" stroke="#2a3441"/>
    <text x="547" y="372">DEVELOP</text>
    <rect x="658" y="344" width="150" height="44" rx="22" fill="#10151c" stroke="#2a3441"/>
    <text x="733" y="372">EXPLOIT</text>
    <rect x="844" y="344" width="150" height="44" rx="22" fill="#10151c" stroke="#2a3441"/>
    <text x="919" y="372">REPORT</text>
  </g>

  <g stroke="#3a4553" stroke-width="2">
    <line x1="438" y1="366" x2="470" y2="366" marker-end="url(#arrow)"/>
    <line x1="624" y1="366" x2="656" y2="366" marker-end="url(#arrow)"/>
    <line x1="810" y1="366" x2="842" y2="366" marker-end="url(#arrow)"/>
  </g>

  <path d="M919,390 C919,442 361,442 361,394" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowteal)"/>
  <rect x="472" y="420" width="336" height="20" fill="#0a0e13"/>
  <text x="640" y="434" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" letter-spacing="2" fill="#2dd4bf">REPRODUCE, VERIFY, SHIP UPSTREAM</text>
</svg>
